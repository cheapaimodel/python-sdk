[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cheapaimodel"
version = "0.1.0"
description = "Official lightweight Python client for the CheapAIModel API (OpenAI-compatible)"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
dependencies = ["openai>=1.40"]
keywords = ["llm", "ai", "openai", "api", "cheapaimodel"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.urls]
Homepage = "https://cheapaimodel.com"
Repository = "https://github.com/cheapaimodel/python-sdk"

[tool.hatch.build.targets.wheel]
packages = ["src/cheapaimodel"]
